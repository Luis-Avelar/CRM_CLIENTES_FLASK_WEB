<!DOCTYPE html>
<html>
<head>
    <title>CRM Clientes</title>

    <!-- 🔥 Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-center mb-4">CRM Clientes</h1>

    <!-- FORMULARIO -->
    <div class="card p-4 mb-4">
        <h4>Agregar Cliente</h4>
        <form action="/agregar" method="POST" class="row g-3">
            <div class="col-md-4">
                <input type="text" name="nombre" class="form-control" placeholder="Nombre" required>
            </div>
            <div class="col-md-4">
                <input type="text" name="telefono" class="form-control" placeholder="Teléfono" required>
            </div>
            <div class="col-md-4">
                <input type="email" name="correo" class="form-control" placeholder="Correo" required>
            </div>

            <div class="col-12">
                <button class="btn btn-primary">Agregar</button>
            </div>
        </form>
    </div>

    <!-- TABLA -->
    <div class="card p-4">
        <h4>Lista de Clientes</h4>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Correo</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                {% for cliente in clientes %}
                <tr>
                    <td>{{ cliente[1] }}</td>
                    <td>{{ cliente[2] }}</td>
                    <td>{{ cliente[3] }}</td>
                    <td>
                        <a href="/editar/{{ cliente[0] }}" class="btn btn-warning btn-sm">Editar</a>
                        <a href="/eliminar/{{ cliente[0] }}" 
   class="btn btn-danger btn-sm"
   onclick="return confirm('¿Seguro que quieres eliminar este cliente?')">
   Eliminar
</a>   
                    </td>
                </tr>
                {% endfor %}
            </tbody>

        </table>
    </div>

</div>

</body>
</html>
