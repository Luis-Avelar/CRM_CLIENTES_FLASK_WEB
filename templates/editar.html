<!DOCTYPE html>
<html>
<head>
    <title>Editar Cliente</title>
</head>
<body>

    <h1>Editar Cliente</h1>

    <form action="/actualizar/{{ cliente[0] }}" method="POST">
        <input type="text" name="nombre" value="{{ cliente[1] }}" required>
        <input type="text" name="telefono" value="{{ cliente[2] }}" required>
        <input type="email" name="correo" value="{{ cliente[3] }}" required>

        <button type="submit">Guardar cambios</button>
    </form>

    <br>
    <a href="/">Volver</a>

</body>
</html>
